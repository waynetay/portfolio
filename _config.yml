The `theme_mode: dark` setting selects dark mode by default. Chirpy also supports a theme toggle. <Cite refs={["turn584770search1"]}/>

## Step 3: Turn it into your portfolio

Chirpy is designed primarily for technical writing, so I'd use its navigation tabs to organise your work:

- **Home** — short introduction and featured projects.
- **Projects** — TAVAttendance and Student Management System.
- **Achievements** — cybersecurity, academic awards, and Taekwondo.
- **About** — SST Inc., ARC@SST, and your technical skills.

You can use Chirpy's built-in pages and navigation rather than creating a custom design from scratch.

One last thing: the configuration above assumes your site URL will be `wayne005.github.io`. If your current site uses a different URL, update `url` and `baseurl` accordingly.
